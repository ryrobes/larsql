# Nginx Content Negotiation for larsql.com
#
# This configuration serves markdown when Accept: text/markdown is requested,
# otherwise serves HTML.
#
# Usage: Include this in your server block or adapt to your nginx setup.
#
# Test with:
#   curl https://larsql.com/content/quickstart.html           # HTML (default)
#   curl -H 'Accept: text/markdown' https://larsql.com/content/quickstart.html  # Markdown

# Map Accept header to file suffix
map $http_accept $markdown_suffix {
    default         "";
    "~*text/markdown" ".md";
}

# Map for Content-Type header based on what we're serving
map $markdown_suffix $content_type_override {
    default "";
    ".md"   "text/markdown; charset=utf-8";
}

server {
    listen 443 ssl http2;
    server_name larsql.com;

    root /var/www/larsql/doc_pages;
    index index.html;

    # Always include Vary header for proper caching
    add_header Vary "Accept" always;

    # Content pages - support markdown negotiation
    location /content/ {
        # If markdown requested and .md file exists, serve it
        # Otherwise fall back to the original request
        try_files $uri$markdown_suffix $uri =404;

        # Set Content-Type for markdown responses
        if ($markdown_suffix = ".md") {
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
        }
    }

    # Static assets - no content negotiation needed
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Root and other pages
    location / {
        try_files $uri $uri/ /index.html;
    }
}

