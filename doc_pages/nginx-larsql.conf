# Default server configuration

# Map Accept header to determine if markdown is requested
map $http_accept $wants_markdown {
    default         0;
    "~*text/markdown" 1;
}

server {

    # SSL configuration
    #
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    #
    # Note: You should disable gzip for SSL traffic.
    # See: https://bugs.debian.org/773332
    #
    # Read up on ssl_ciphers to ensure a secure configuration.
    # See: https://bugs.debian.org/765782
    #
    # Self signed certs generated by the ssl-cert package
    # Don't use them in a production server!
    #
    # include snippets/snakeoil.conf;

    root /var/www/html;

    # Add index.php to the list if you are using PHP
    index index.html index.htm index.nginx-debian.html;

    server_name larsql.com;

    # Always include Vary header for proper caching
    add_header Vary "Accept" always;

    # Root URL - handle / and /index.html
    location = / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /index.html {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        try_files $uri =404;
    }

    # Content pages - support markdown content negotiation
    # When Accept: text/markdown is sent, rewrite .html to .md
    location /content/ {
        if ($wants_markdown) {
            rewrite ^(/content/.+)\.html$ $1.md last;
        }
        try_files $uri =404;
    }

    # Docs page
    location = /docs.html {
        if ($wants_markdown) {
            rewrite ^ /docs.md last;
        }
        try_files $uri =404;
    }

    # Set proper Content-Type for all markdown files
    location ~ \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        try_files $uri =404;
    }

    location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
        try_files $uri $uri/ =404;
    }

    # pass PHP scripts to FastCGI server
    #
    #location ~ \.php$ {
    #    include snippets/fastcgi-php.conf;
    #
    #    # With php-fpm (or other unix sockets):
    #    fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    #    # With php-cgi (or other tcp sockets):
    #    fastcgi_pass 127.0.0.1:9000;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny all;
    #}

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/larsql.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/larsql.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


# Virtual Host configuration for example.com
#
# You can move that to a different file under sites-available/ and symlink that
# to sites-enabled/ to enable it.
#
#server {
#    listen 80;
#    listen [::]:80;
#
#    server_name example.com;
#
#    root /var/www/example.com;
#    index index.html;
#
#    location / {
#        try_files $uri $uri/ =404;
#    }
#}

server {
    if ($host = larsql.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;

    server_name larsql.com;
    return 404; # managed by Certbot


}
