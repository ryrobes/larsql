# SQL Connections Integration Test Infrastructure
#
# USAGE:
#   Start core services (MinIO + MongoDB):
#     docker compose -f docker-compose.sql-tests.yml up -d
#
#   Start with Cassandra (slow to start):
#     docker compose -f docker-compose.sql-tests.yml --profile cassandra up -d
#
#   Run MinIO setup after services are ready:
#     python tests/fixtures/setup_minio.py
#
#   Stop and cleanup:
#     docker compose -f docker-compose.sql-tests.yml down -v
#

services:
  # ===========================================================================
  # MinIO - S3-Compatible Object Storage
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: lars-test-minio
    ports:
      - "9100:9000"    # S3 API
      - "9101:9001"    # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - sql-tests
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ===========================================================================
  # MongoDB
  # ===========================================================================
  mongodb:
    image: mongo:7
    container_name: lars-test-mongodb
    ports:
      - "27117:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: testpassword
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - mongodb-data:/data/db
      - ./tests/fixtures/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - sql-tests
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # Cassandra (optional - slow to start)
  # ===========================================================================
  cassandra:
    image: cassandra:4.1
    container_name: lars-test-cassandra
    profiles:
      - cassandra
    ports:
      - "9142:9042"    # CQL native protocol
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - sql-tests
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ===========================================================================
  # PostgreSQL (for postgres connector tests)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: lars-test-postgres
    ports:
      - "5532:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - sql-tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # MySQL (for mysql connector tests)
  # ===========================================================================
  mysql:
    image: mysql:8
    container_name: lars-test-mysql
    ports:
      - "3406:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - sql-tests
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # MariaDB (MySQL-compatible, tests compatibility)
  # ===========================================================================
  mariadb:
    image: mariadb:11
    container_name: lars-test-mariadb
    ports:
      - "3407:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: testdb
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpassword
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - sql-tests
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # Microsoft SQL Server 2022 (Express)
  # ===========================================================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lars-test-mssql
    ports:
      - "1533:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestPass123!"
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - sql-tests
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TestPass123!" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # ClickHouse (analytics database)
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: lars-test-clickhouse
    ports:
      - "8223:8123"    # HTTP interface
      - "9200:9000"    # Native TCP
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: testpassword
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-scripts/clickhouse:/docker-entrypoint-initdb.d:ro
    networks:
      - sql-tests
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio-data:
  mongodb-data:
  cassandra-data:
  postgres-data:
  mysql-data:
  mariadb-data:
  mssql-data:
  clickhouse-data:

networks:
  sql-tests:
    driver: bridge
