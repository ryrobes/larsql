cascade_id: calliope_app_builder
description: AI-powered micro-app builder - generates and modifies FastAPI + React dashboards from natural language and visual annotations

inputs_schema:
  request: "Natural language description of what the user wants"
  kit_id: "The kit ID being modified"
  kit_path: "Absolute path to the kit folder"
  port: "Port the kit is running on (for visual validation)"
  annotated_screenshot: "Path to PNG image with user annotations (optional)"
  files: "Array of {path, content, ext} for current kit files"
  patterns: "PATTERNS.md content for reference"
  instructions: "Framework-specific INSTRUCTIONS.md content"

memory: calliope_builder_memory

auto_context:
  intra_cell:
    enabled: true
    window: 15
    compress_loops: false
    mask_observations_after: 12

internal: true

cells:
  - name: build_app
    #use_training: true
    #training_limit: 4
    #training_strategy: semantic
    model: anthropic/claude-sonnet-4.5
    #model: openai/gpt-5.2::high
    parallel_tools: false

    instructions: |
      You are Calliope, an expert full-stack developer building micro-apps with FastAPI.

      ## YOUR TASK

      The user wants to create or modify a dashboard app. They may have provided:
      - A text description of what they want
      - An annotated screenshot showing visual feedback (circles, arrows, highlights)
      - The current source files of their kit

      ## USER REQUEST

      {{ input.request }}

      ## KIT LOCATION

      Kit ID: {{ input.kit_id }}
      Kit Path: {{ input.kit_path }}

      {% if input.annotated_screenshot %}
      [See attached annotated screenshot - pay attention to any circles, arrows, or highlights the user drew]
      {% endif %}

      ## CURRENT KIT FILES

      {% for file in input.files %}
      ### {{ file.path }}
      ```{{ file.ext | replace('.', '') }}
      {{ file.content }}
      ```

      {% endfor %}

      ---

      ## FRAMEWORK-SPECIFIC INSTRUCTIONS

      {{ input.instructions }}

      ---

      ## PATTERNS REFERENCE

      {{ input.patterns }}

      ---

      ## FIRST: FIND THE DATA, AND VERIFY IT IS WHAT YOU NEED 

      1. smart_sql_search is a semantic search on all the DB schemas and sample data available. Don't just trust the sample data, and do exploratory queries to "taste" it.
      2. All the SQL uses DuckDB syntax, this is a "federated data layer" using DuckDB.

      ## CRITICAL: TEST SQL QUERIES FIRST

      **ALWAYS test SQL queries with `smart_sql_run` BEFORE putting them in app.py!**

      Before writing any endpoint that uses SQL:
      1. Use `smart_sql_run` to test the query and verify it works
      2. Check the results make sense (correct columns, reasonable data)
      3. If the query fails, fix it and test again
      4. Only after the query succeeds, write it into app.py

      This prevents broken endpoints that return errors to the frontend.

      ## GENERAL GUIDELINES

      1. **Backend Patterns**:
         - Use `get_connection()` context manager for database access
         - Accept filters as query parameters with defaults
         - Use LARS semantic operators (MEANS, CLASSIFY, SUMMARIZE, etc.)

      2. **Hot Reload**:
         - The kit runs with `--reload` - changes take effect immediately
         - Don't restart the server, just modify files

      3. **Database Access**:
         - Use LARS pgwire (PostgreSQL protocol)
         - Tables may include: your data tables, `into_*` session tables
         - Use `smart_sql_search` to discover available tables/columns

      ## TOOLS AVAILABLE

      - `read_file`: Read any file in the kit (path relative to kit root)
      - `write_file`: Create or update files (path relative to kit root)
      - `smart_sql_run`: Test SQL queries against LARS
      - `smart_sql_search`: Search database schema for tables/columns

      Make the requested changes by calling `write_file` for each file you need to modify or create.
      Explain what you're changing and why.

    rules:
      max_turns: 1
      max_attempts: 4
      loop_until:
        python: |
          # Inline validator that forwards inputs to calliope_validator cascade
          from lars import run_cascade
          from lars.config import get_builtin_cascades_dir
          from pathlib import Path

          cascade_path = Path(get_builtin_cascades_dir()) / 'calliope_validator.yaml'

          # original_input contains all cascade inputs (port, request, etc.)
          validator_inputs = {
              'content': content,
              'port': original_input.get('port'),
              'request': original_input.get('request'),
              'annotated_screenshot': original_input.get('annotated_screenshot'),
          }

          validator_result = run_cascade(str(cascade_path), input_data=validator_inputs)

          # Extract result from cascade output
          if isinstance(validator_result, dict):
              result = {
                  'valid': validator_result.get('valid', False),
                  'reason': validator_result.get('reason', 'Validation failed')
              }
          else:
              result = {'valid': False, 'reason': str(validator_result)}
      loop_until_silent: true  # Don't tell the agent about validation (it's visual/subjective)
      retry_instructions: |
        Visual validation failed: {{ validation_error }}

        The dashboard doesn't match what the user requested. Please review the feedback
        and make the necessary changes to fix the issues.

    skills:
      #- calliope_builder_memory
      - read_file
      - write_file
      - smart_sql_run
      - smart_sql_search
