# RVBBIT Atom Resolver (Linear Multi-Phase)
#
# 1) discover_tables    -> find grounded table candidates
# 2) draft_atoms        -> produce SQL + display spec draft
# 3) execute_and_verify -> run/repair SQL and return verified output

cascade_id: rvbbit_atom_resolver
description: |
  Resolves natural language intents into RVBBIT atom specifications using
  grounded discovery, high-quality drafting, and SQL execution verification.

inputs_schema:
  intent: "Natural language description of what the user wants to see"
  scope: "atom | grid — whether resolving a single atom or planning a full grid"
  schema_context: "Optional: pre-fetched schema summary"
  sibling_context: "Optional: JSON array of existing sibling atoms (intent + displayType + title)"
  grid_name: "Optional: name of the grid this atom belongs to"

internal: true
model: "{{ models.flagship }}"

auto_context:
  intra_cell:
    enabled: true
    window: 5
    compress_loops: true
    mask_observations_after: 3

cells:
  - name: discover_tables
    model: "{{ models.flagship }}"
    skills:
      - sql_search
    use_native_tools: true
    handoffs:
      - parse_discovery
    rules:
      max_attempts: 3
      max_turns: 1
      loop_until:
        python: |
          import json

          def _parse(text):
              s = (text or "").strip()
              if s.startswith("```"):
                  lines = s.splitlines()
                  if len(lines) >= 2:
                      s = "\n".join(lines[1:])
              if s.endswith("```"):
                  s = s.rsplit("```", 1)[0]
              s = s.strip()
              try:
                  return json.loads(s)
              except Exception:
                  return None

          obj = _parse(content)
          if not isinstance(obj, dict):
              result = {"valid": False, "reason": "Return JSON object: {tables:[...], notes:'...'}"}
          elif not isinstance(obj.get("tables"), list) or len(obj.get("tables", [])) == 0:
              result = {"valid": False, "reason": "tables must be a non-empty array."}
          else:
              tool_names = set()
              for item in (locals().get("tool_outputs", []) or []):
                  if isinstance(item, dict):
                      tool_names.add(str(item.get("tool") or item.get("tool_name") or "").strip())

              has_search = any(n in {"sql_search", "smart_sql_search"} for n in tool_names)
              if not has_search:
                  result = {"valid": False, "reason": "Call sql_search before returning final JSON."}
              else:
                  result = {"valid": True, "reason": f"Grounded discovery with {len(obj['tables'])} tables."}
      retry_instructions: |
        {{ validation_reason }}
        Tool calls are allowed before final JSON.
        First call sql_search with k<=5, then return grounded candidates.
        Return ONLY JSON object: {"tables":[...], "notes":"..."}.
        Attempt {{ attempt }}/{{ max_attempts }}.
    output_schema:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - qualified_name
              - sql_table_ref
              - reason
              - key_columns
            properties:
              qualified_name: { type: string }
              sql_table_ref: { type: string }
              reason: { type: string }
              database: { type: [string, "null"] }
              schema: { type: [string, "null"] }
              table_name: { type: [string, "null"] }
              key_columns:
                type: array
                items: { type: string }
              numeric_columns:
                type: array
                items: { type: string }
              time_columns:
                type: array
                items: { type: string }
            additionalProperties: true
        notes: { type: [string, "null"] }
      additionalProperties: false
    instructions: |
      You are the DISCOVERY phase for RVBBIT atom resolution.

      User intent:
      {{ input.intent }}

      Scope: {{ input.scope | default("atom") }}

      {% if input.schema_context %}
      Schema context (if provided):
      {{ input.schema_context }}
      {% endif %}

      Required workflow:
      1. Call `sql_search(query=..., k=5)` to find tables relevant to this exact intent.
      2. Use `sql_search` results directly and return only grounded candidates useful for drafting SQL.

      Discovery quality bar:
      - Prefer fact/event tables that directly contain requested measures and dimensions.
      - Include dimension/lookup tables only when they materially improve labels or joins.
      - Keep list tight (1-5 tables), not broad.
      - Put strongest candidates first.

      Naming rules:
      - Use `sql_table_ref` exactly as returned by tools.
      - Never append synthetic schema names like `.main`.
      - If schema is null (attached/federated sources like CSV), use `database.table`.

      Return JSON only:
      {
        "tables": [
          {
            "qualified_name": "csv_files.some_table",
            "sql_table_ref": "csv_files.some_table",
            "reason": "why this table is relevant",
            "database": "csv_files",
            "schema": null,
            "table_name": "some_table",
            "key_columns": ["dimension_a", "dimension_b"],
            "numeric_columns": ["measure_x"],
            "time_columns": ["event_ts"]
          }
        ],
        "notes": "short planning notes"
      }

  - name: parse_discovery
    tool: python:lars.demo_tools.parse_json
    handoffs:
      - draft_atoms
    inputs:
      text: "{{ state.output_discover_tables }}"

  - name: draft_atoms
    model: "{{ models.flagship }}"
    handoffs:
      - parse_draft
    rules:
      max_attempts: 3
      max_turns: 1
      retry_instructions: |
        {{ schema_error }}
        Return ONLY JSON matching the schema.
        Use only discovery sql_table_ref values in FROM/JOIN.
    output_schema:
      type: object
      required: [atoms]
      properties:
        atoms:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required:
              - intent
              - title
              - summary
              - sql
              - displayType
              - gridSize
              - detectedDimensions
              - verified
            properties:
              intent:
                type: string
                minLength: 5
              title:
                type: string
                minLength: 2
              summary:
                type: string
                minLength: 5
              sql:
                type: string
                minLength: 12
              displayType:
                type: string
                enum:
                  - number
                  - text
                  - barChart
                  - lineChart
                  - areaChart
                  - scatterPlot
                  - pieChart
                  - table
                  - sparkline
                  - list
                  - map
                  - status
              gridSize:
                type: string
                enum:
                  - small
                  - wide
                  - medium
                  - large
                  - full
                  - quarter
                  - third
                  - half
              detectedDimensions:
                type: array
                items:
                  type: string
              verified:
                type: boolean
                const: false
              displayHints:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: false
    instructions: |
      You are the DRAFT phase for RVBBIT atom resolution.

      User intent:
      {{ input.intent }}

      Scope: {{ input.scope | default("atom") }}

      Grounded discovery output:
      {{ state.output_parse_discovery.data | tojson }}

      {% if input.sibling_context %}
      Existing siblings (avoid overlap, prefer complementary coverage):
      {{ input.sibling_context }}
      {% endif %}

      Task:
      - Draft atom specs and SQL using only discovered `sql_table_ref` references.
      - Do not execute SQL in this phase.
      - Set `verified` to false for all atoms.

      Output quality bar:
      - Scope `atom`: exactly 1 high-quality atom.
      - Scope `grid`: 4-8 complementary atoms that tell a coherent story.
      - SQL must be complete DuckDB SQL with real columns (no placeholders).
      - Use explicit SELECT aliases; avoid `SELECT *`.
      - Keep title/summary tightly aligned with SQL output.

      Display selection heuristics:
      - If intent is "top N by category", default to `barChart`, not `table`.
      - If intent is trend over time, default to `lineChart` or `areaChart`.
      - If intent is a single KPI value, use `number`.
      - Use `table` only for record-level or multi-column detail views.

      RVBBIT chart hint DSL (use `displayHints`, keyed to SELECT aliases):

      Example A: Number KPI
      {
        "displayType": "number",
        "displayHints": {"value": "total_sightings", "format": "integer"}
      }

      Example B: Top-N Bar Chart
      SQL shape:
      SELECT state, COUNT(*) AS sightings_count
      FROM csv_files.ufo_sightings
      GROUP BY state
      ORDER BY sightings_count DESC
      LIMIT 10
      displayHints:
      {
        "x": "state",
        "y": "sightings_count",
        "sort": "-sightings_count",
        "orientation": "vertical"
      }

      Example C: Time Series Line Chart
      SQL shape:
      SELECT month, SUM(revenue) AS total_revenue
      FROM ...
      GROUP BY month
      ORDER BY month
      displayHints:
      {
        "x": "month",
        "y": "total_revenue"
      }

      Example D: Detail Table
      {
        "displayType": "table",
        "displayHints": {
          "columns": ["payment_id", "status", "amount", "attempted_at"],
          "defaultSort": [{"field": "attempted_at", "direction": "desc"}]
        }
      }

      DuckDB + naming rules:
      - Use discovered table refs exactly; do not invent schema segments.
      - If discovery returned `csv_files.ufo_sightings`, use that exact reference.
      - Keep `detectedDimensions` to categorical/time fields, not pure measures.

      Return JSON only.

  - name: parse_draft
    tool: python:lars.demo_tools.parse_json
    handoffs:
      - execute_and_verify
    inputs:
      text: "{{ state.output_draft_atoms }}"

  - name: execute_and_verify
    model: "{{ models.flagship }}"
    skills:
      - safe_sql_run
    use_native_tools: false
    output_schema:
      type: object
      required: [atoms]
      properties:
        atoms:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required:
              - intent
              - title
              - summary
              - sql
              - displayType
              - gridSize
              - detectedDimensions
              - verified
            properties:
              intent: { type: string }
              title: { type: string }
              summary: { type: string }
              sql: { type: string }
              displayType:
                type: string
                enum:
                  - number
                  - text
                  - barChart
                  - lineChart
                  - areaChart
                  - scatterPlot
                  - pieChart
                  - table
                  - sparkline
                  - list
                  - map
                  - status
              gridSize:
                type: string
                enum:
                  - small
                  - wide
                  - medium
                  - large
                  - full
                  - quarter
                  - third
                  - half
              detectedDimensions:
                type: array
                items: { type: string }
              verified: { type: boolean }
              displayHints:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: false
    rules:
      max_attempts: 4
      max_turns: 1
      loop_until: valid_rvbbit_atom
      retry_instructions: |
        {{ validation_reason }}
        Tool calls are allowed before final JSON.
        Execute each candidate SQL with safe_sql_run.
        If SQL errors or returns 0 rows, repair SQL and rerun safe_sql_run.
        Set verified=true only after successful safe_sql_run output (row_count > 0).
        Return ONLY JSON object with atoms array.
        Attempt {{ attempt }}/{{ max_attempts }}.
    instructions: |
      You are the EXECUTE+VERIFY phase for RVBBIT atom resolution.

      User intent:
      {{ input.intent }}

      Scope: {{ input.scope | default("atom") }}

      Grounded discovery refs:
      {{ state.output_parse_discovery.data | tojson }}

      Draft atoms:
      {{ state.output_parse_draft.data | tojson }}

      Task:
      1. Execute each draft SQL via `safe_sql_run`.
      2. If SQL errors or returns zero rows, repair and rerun.
      3. Return final atoms with executable SQL and high-quality display metadata.

      Rendering quality checks:
      - Ensure displayType matches the intent and SQL shape.
      - For chart atoms, keep displayHints tied to real SELECT aliases.
      - If user asked for a chart and SQL supports aggregated chart output, do not fall back to table.
      - Keep titles short and specific; summaries factual and concise.

      Guardrails:
      - DuckDB SQL syntax only.
      - Use only discovered table refs; do not invent schema/table paths.
      - For sources with null schema, use `database.table` exactly (never `.main`).
      - For scope=atom, final output must contain exactly one verified atom.

      Return JSON only.
