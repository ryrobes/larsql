# RVBBIT Atom Resolver (Linear Multi-Phase)
#
# 1) discover_tables    -> find grounded table candidates
# 2) draft_atoms        -> produce SQL + Vega-lite-first display spec draft
# 3) execute_and_verify -> run/repair SQL and return verified output

cascade_id: rvbbit_atom_resolver
description: |
  Resolves natural language intents into RVBBIT atom specifications using
  grounded discovery, high-quality drafting, and SQL execution verification.

inputs_schema:
  intent: "Natural language description of what the user wants to see"
  scope: "atom | grid — whether resolving a single atom or planning a full grid"
  schema_context: "Optional: pre-fetched schema summary"
  sibling_context: "Optional: JSON array of existing sibling atoms (intent + displayType + displayHints + title)"
  grid_name: "Optional: name of the grid this atom belongs to"

internal: true
model: "{{ models.flagship }}"

auto_context:
  intra_cell:
    enabled: true
    window: 5
    compress_loops: true
    mask_observations_after: 3

tool_caching:
  enabled: false

cells:
  - name: discover_tables
    model: "{{ models.flagship }}"
    skills:
      - kg_search
    use_native_tools: true
    handoffs:
      - parse_discovery
    context:
      anchors:
        from_phases:
          - previous
        include:
          - output
    rules:
      max_attempts: 3
      max_turns: 1
      loop_until:
        python: |
          import json

          def _parse(text):
              s = (text or "").strip()
              if s.startswith("```"):
                  lines = s.splitlines()
                  if len(lines) >= 2:
                      s = "\n".join(lines[1:])
              if s.endswith("```"):
                  s = s.rsplit("```", 1)[0]
              s = s.strip()
              try:
                  return json.loads(s)
              except Exception:
                  return None

          obj = _parse(content)
          if not isinstance(obj, dict):
              result = {"valid": False, "reason": "Return JSON object: {tables:[...], notes:'...'}"}
          elif not isinstance(obj.get("tables"), list) or len(obj.get("tables", [])) == 0:
              result = {"valid": False, "reason": "tables must be a non-empty array."}
          else:
              tool_names = set()
              for item in (locals().get("tool_outputs", []) or []):
                  if isinstance(item, dict):
                      tool_names.add(str(item.get("tool") or item.get("tool_name") or "").strip())

              has_search = any(n in {"kg_search", "sql_search", "smart_sql_search"} for n in tool_names)
              if not has_search:
                  result = {"valid": False, "reason": "Call kg_search before returning final JSON."}
              else:
                  result = {"valid": True, "reason": f"Grounded discovery with {len(obj['tables'])} tables."}
      retry_instructions: |
        {{ validation_reason }}
        Tool calls are allowed before final JSON.
        First call kg_search with k<=3, then return grounded candidates.
        Return ONLY JSON object: {"tables":[...], "notes":"..."}.
        Attempt {{ attempt }}/{{ max_attempts }}.
    output_schema:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - qualified_name
              - sql_table_ref
              - reason
              - key_columns
            properties:
              qualified_name: { type: string }
              sql_table_ref: { type: string }
              reason: { type: string }
              database: { type: [string, "null"] }
              schema: { type: [string, "null"] }
              table_name: { type: [string, "null"] }
              key_columns:
                type: array
                items: { type: string }
              numeric_columns:
                type: array
                items: { type: string }
              time_columns:
                type: array
                items: { type: string }
            additionalProperties: true
        notes: { type: [string, "null"] }
        join_paths: { type: [string, "null"] }
      additionalProperties: false
    instructions: |
      You are the DISCOVERY phase for RVBBIT atom resolution.

      User intent:
      {{ input.intent }}

      Scope: {{ input.scope | default("atom") }}

      {% if input.schema_context %}
      Schema context (if provided):
      {{ input.schema_context }}
      {% endif %}

      Required workflow:
      1. Call `kg_search(query=..., k=3)` to find tables relevant to this intent.
         kg_search returns EVERYTHING you need in one call:
         - Table descriptions and semantic observations from the knowledge graph
         - Complete column schema (names, types, distinct counts, value ranges, top values)
         - sql_table_ref for use in FROM clauses
         - FK relationship and data quality observations
      2. Review the kg_search results and select the best candidates for SQL drafting.
         The observations tell you about column roles, data patterns, and join paths.

      Discovery quality bar:
      - Prefer fact/event tables that directly contain requested measures and dimensions.
      - Include dimension/lookup tables only when they materially improve labels or joins.
      - Use relationship observations to identify join paths rather than guessing from column names.
      - Keep list tight (1-5 tables), not broad.
      - Put strongest candidates first.

      Naming rules:
      - Use `sql_table_ref` exactly as returned by kg_search.
      - Never append synthetic schema names like `.main`.
      - If schema is null (attached/federated sources like CSV), use `database.table`.

      Return JSON only:
      {
        "tables": [
          {
            "qualified_name": "csv_files.some_table",
            "sql_table_ref": "csv_files.some_table",
            "reason": "why this table is relevant",
            "database": "csv_files",
            "schema": null,
            "table_name": "some_table",
            "key_columns": ["dimension_a", "dimension_b"],
            "numeric_columns": ["measure_x"],
            "time_columns": ["event_ts"]
          }
        ],
        "notes": "short planning notes",
        "join_paths": "any FK relationships from kg_search observations (e.g., orders.customer_id → customers)"
      }

  - name: parse_discovery
    tool: python:lars.demo_tools.parse_json
    handoffs:
      - draft_atoms
    context:
      anchors:
        from_phases:
          - previous
        include:
          - output
    inputs:
      text: "{{ state.output_discover_tables }}"

  - name: draft_atoms
    model: "{{ models.flagship }}"
    handoffs:
      - parse_draft
    context:
      anchors:
        from_phases:
          - previous
        include:
          - output
    rules:
      max_attempts: 3
      max_turns: 1
      retry_instructions: |
        {{ schema_error }}
        Return ONLY JSON matching the schema.
        Use only discovery sql_table_ref values in FROM/JOIN.
    output_schema:
      type: object
      required: [atoms]
      properties:
        atoms:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required:
              - intent
              - title
              - summary
              - sql
              - displayType
              - gridSize
              - detectedDimensions
              - verified
            properties:
              intent:
                type: string
                minLength: 5
              title:
                type: string
                minLength: 2
              summary:
                type: string
                minLength: 5
              sql:
                type: string
                minLength: 12
              displayType:
                type: string
                enum:
                  - number
                  - text
                  - barChart
                  - lineChart
                  - areaChart
                  - scatterPlot
                  - pieChart
                  - table
                  - sparkline
                  - list
                  - map
                  - status
              gridSize:
                type: string
                enum:
                  - small
                  - wide
                  - medium
                  - large
                  - full
                  - quarter
                  - third
                  - half
              detectedDimensions:
                type: array
                items:
                  type: string
              verified:
                type: boolean
                const: false
              displayHints:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: false
    instructions: |
      You are the DRAFT phase for RVBBIT atom resolution.

      User intent:
      {{ input.intent }}

      Scope: {{ input.scope | default("atom") }}

      Grounded discovery output:
      {{ state.output_parse_discovery.data | tojson }}

      {% if state.output_parse_discovery.data.join_paths %}
      Known join paths (from knowledge graph):
      {{ state.output_parse_discovery.data.join_paths }}
      Use these when writing JOINs instead of guessing from column names.
      {% endif %}

      {% if input.sibling_context %}
      Existing siblings (avoid overlap, prefer complementary coverage):
      {{ input.sibling_context }}
      {% endif %}

      Task:
      - Draft atom specs and SQL using only discovered `sql_table_ref` references.
      - Do not execute SQL in this phase. Set `verified` to false.
      - Scope `atom`: exactly 1 atom. Scope `grid`: 4-8 complementary atoms.
      - SQL must be complete DuckDB SQL with real columns, explicit SELECT aliases, no `SELECT *`.

      Display type selection:
      - Top N by category → `barChart`
      - Trend over time → `lineChart` or `areaChart`
      - Single KPI → `number`
      - Record-level detail → `table`

      Chart spec contract:
      For chart displayTypes, put a Vega-Lite spec object in `displayHints.spec`.
      The `spec` value is a JSON object (not a string). SQL must do ALL data shaping.

      SUPPORTED keys only (everything else is silently dropped):
        marks:     bar, line, area, point, rule, rect
        encoding:  x, y, x2, y2, color, detail
        channel:   field, type (nominal/quantitative/temporal/ordinal), timeUnit, axis, scale, stack
        axis:      title, grid, tickCount, format, orient, timeZone, weekStart, fillMissing
        scale:     domain ([min,max])
        mark obj:  type, opacity, strokeWidth, interpolate, size, cornerRadius, color, fill, stroke, strokeDash
        layer:     array of {mark, encoding} for multi-mark charts

      NOT SUPPORTED (silently ignored — do not use):
        transform, aggregate, calculate, filter, selection, condition, params,
        facet, repeat, concat, resolve, data, datasets, projection, window, lookup

      Every `field` value must exactly match a SELECT alias from the SQL.

      Example A — Bar chart:
      SQL: SELECT state, COUNT(*) AS sightings FROM t GROUP BY state ORDER BY sightings DESC LIMIT 10
      {
        "displayType": "barChart",
        "displayHints": {
          "spec": {
            "mark": "bar",
            "encoding": {
              "x": {"field": "state", "type": "nominal"},
              "y": {"field": "sightings", "type": "quantitative"}
            }
          }
        }
      }

      Example B — Time series:
      SQL: SELECT month, SUM(revenue) AS total_revenue FROM t GROUP BY month ORDER BY month
      {
        "displayType": "lineChart",
        "displayHints": {
          "spec": {
            "mark": "line",
            "encoding": {
              "x": {"field": "month", "type": "temporal", "timeUnit": "month"},
              "y": {"field": "total_revenue", "type": "quantitative"}
            }
          }
        }
      }

      Example C — Number KPI:
      {"displayType": "number", "displayHints": {"value": "total_count", "format": "integer"}}

      Example D — Table:
      {"displayType": "table", "displayHints": {"columns": ["id", "status", "amount"]}}

      DuckDB rules:
      - Use discovered table refs exactly; do not invent schema segments.
      - Keep `detectedDimensions` to categorical/time fields, not pure measures.

      Return JSON only.

  - name: parse_draft
    tool: python:lars.demo_tools.parse_json
    handoffs:
      - execute_and_verify
    context:
      anchors:
        from_phases:
          - previous
        include:
          - output
    inputs:
      text: "{{ state.output_draft_atoms }}"

  - name: execute_and_verify
    model: "{{ models.flagship }}"
    skills:
      - safe_sql_run
    context:
      anchors:
        from_phases:
          - previous
        include:
          - output
    use_native_tools: true
    output_schema:
      type: object
      required: [atoms]
      properties:
        atoms:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required:
              - intent
              - title
              - summary
              - sql
              - displayType
              - gridSize
              - detectedDimensions
              - verified
            properties:
              intent: { type: string }
              title: { type: string }
              summary: { type: string }
              sql: { type: string }
              displayType:
                type: string
                enum:
                  - number
                  - text
                  - barChart
                  - lineChart
                  - areaChart
                  - scatterPlot
                  - pieChart
                  - table
                  - sparkline
                  - list
                  - map
                  - status
              gridSize:
                type: string
                enum:
                  - small
                  - wide
                  - medium
                  - large
                  - full
                  - quarter
                  - third
                  - half
              detectedDimensions:
                type: array
                items: { type: string }
              verified: { type: boolean }
              displayHints:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: false
    rules:
      max_attempts: 4
      max_turns: 1
      loop_until: valid_rvbbit_atom
      retry_instructions: |
        {{ validation_reason }}
        Tool calls are allowed before final JSON.
        Execute each candidate SQL with safe_sql_run.
        If SQL errors or returns 0 rows, repair SQL and rerun safe_sql_run.
        Set verified=true only after successful safe_sql_run output (row_count > 0).
        Return ONLY JSON object with atoms array.
        Attempt {{ attempt }}/{{ max_attempts }}.
    instructions: |
      You are the EXECUTE+VERIFY phase for RVBBIT atom resolution.

      User intent:
      {{ input.intent }}

      Scope: {{ input.scope | default("atom") }}

      Grounded discovery refs:
      {{ state.output_parse_discovery.data | tojson }}

      {% if state.output_parse_discovery.data.join_paths %}
      Known join paths (from knowledge graph):
      {{ state.output_parse_discovery.data.join_paths }}
      Use these when writing or repairing JOINs.
      {% endif %}

      Draft atoms:
      {{ state.output_parse_draft.data | tojson }}

      Task:
      1. Execute each draft SQL via `safe_sql_run`.
      2. If SQL errors or returns zero rows, repair and rerun.
      3. Return final atoms with executable SQL and verified display metadata.

      Spec quality checks:
      - Every `field` in `displayHints.spec.encoding` must match a SELECT alias from the final SQL.
      - `mark` must be one of: bar, line, area, point, rule, rect.
      - Do NOT use transform, aggregate, data, selection, condition, or params keys in the spec.
      - For chart atoms, `displayHints.spec` must be a JSON object (not a string).
      - For time-series intents, ensure `encoding.x.type` is `"temporal"`.
      - If user asked for a chart and SQL supports it, do not fall back to table.
      - Keep titles short and specific; summaries factual and concise.

      Guardrails:
      - DuckDB SQL syntax only.
      - Use only discovered table refs; do not invent schema/table paths.
      - For sources with null schema, use `database.table` exactly (never `.main`).
      - For scope=atom, final output must contain exactly one verified atom.

      Return JSON only.

# takes:
#   evaluator_instructions: "Compare these
#     three complete solution approaches based on:

#     1) Correctness - Does it solve the problem accurately?

#     2) Completeness - Does it cover all aspects?

#     Select the BEST complete solution. DO NOT RETURN REASONS OR EXPLAIN - JUST THE ORIGINAL OUTPUT AND PASS IT AS YOU RECEIVED IT."
#   factor: 3
#   mutate: false
