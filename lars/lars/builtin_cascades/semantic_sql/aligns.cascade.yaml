cascade_id: semantic_aligns
internal: true
description: 'Narrative alignment scoring - returns 0.0-1.0 for how well text aligns
  with a narrative.

  Goes beyond simple topic matching to evaluate consistency, support, and thematic
  fit.

  '
inputs_schema:
  text: The text to evaluate
  narrative: The narrative/thesis to check alignment against
sql_function:
  name: semantic_aligns
  description: Returns 0.0-1.0 score for narrative alignment
  args:
  - name: text
    type: VARCHAR
  - name: narrative
    type: VARCHAR
  returns: DOUBLE
  shape: SCALAR
  operators:
  - '{{ text }} ALIGNS {{ narrative }}'
  - '{{ text }} ALIGNS WITH {{ narrative }}'
  cache: false
  test_cases:
  # ALIGNS WITH infix
  - sql: WITH t AS (SELECT 'We prioritize safety above all' AS msg) SELECT * FROM t WHERE msg ALIGNS WITH 'safety first'
    expect:
      type: contains
      value: safety
    description: "Infix ALIGNS WITH: filters aligned content"
  # ALIGNS infix (shorter form) - need to use WITH for proper parsing
  - sql: "WITH t AS (SELECT 'Our eco-friendly products reduce waste' AS msg) SELECT msg FROM t WHERE msg ALIGNS 'sustainability' > 0.5"
    expect:
      type: contains
      value: eco-friendly
    description: "Infix ALIGNS: filters aligned content"
  # Function syntax
  - sql: "SELECT semantic_aligns('Cost-cutting is our priority', 'quality and safety first')"
    expect:
      type: range
      min: 0.0
      max: 0.5
    description: "Function: low score for misaligned narrative"
  # Alias syntax
  - sql: "SELECT aligns('Innovation drives our strategy', 'forward-thinking')"
    expect:
      type: range
      min: 0.6
      max: 1.0
    description: "Alias aligns(): detects thematic alignment"
cells:
- name: evaluate_alignment
  model: "{{ models.standard }}"
  instructions: |
    Rate how well this text aligns with the given narrative/theme.

    TEXT: {{ input.text }}
    NARRATIVE: {{ input.narrative }}

    ALIGNMENT means the text SUPPORTS, RELATES TO, or EXPRESSES the narrative's theme.

    Scoring guide:
    - 0.0-0.2: Actively contradicts or undermines the narrative
    - 0.2-0.4: Unrelated or weakly against
    - 0.4-0.6: Neutral or tangentially related
    - 0.6-0.8: Supports the narrative, aligned messaging
    - 0.8-1.0: Strongly validates the narrative, perfect alignment

    KEY EXAMPLES:
    - "We prioritize safety above all" + "safety first" → 0.85 (same theme!)
    - "Our eco-friendly products reduce waste" + "sustainability" → 0.8 (eco = sustainability)
    - "Innovation drives our strategy" + "forward-thinking" → 0.75 (innovation = forward-thinking)
    - "Cost-cutting is our priority" + "quality first" → 0.2 (opposing priorities)
    - "The weather is nice" + "financial growth" → 0.1 (unrelated)

    Think about: Does the text EXPRESS or SUPPORT the narrative's core idea?
    - "safety above all" clearly expresses "safety first" → HIGH score
    - "eco-friendly reduces waste" clearly supports "sustainability" → HIGH score

    Return ONLY a decimal number between 0.0 and 1.0.
    No explanation, no quotes, just the number.
  rules:
    max_turns: 1
  output_schema:
    type: number
    minimum: 0.0
    maximum: 1.0
