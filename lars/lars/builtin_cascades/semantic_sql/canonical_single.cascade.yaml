# CANONICAL - Get the canonical/official form of a value
# Simpler than NORMALIZE - auto-detects type
#
# SQL Usage:
#   SELECT CANONICAL(company_name) FROM vendors
#   SELECT CANONICAL(customer_address) FROM orders
#
# Examples:
#   "Intl Business Machines" → "IBM"
#   "123 Main St, NYC, NY" → "123 Main Street, New York, NY"
#   "JOHN SMITH" → "John Smith"

cascade_id: canonical_single
internal: true

description: |
  Get the canonical/official form of a value. Auto-detects the type of entity
  and returns its standard representation.

inputs_schema:
  value: The value to canonicalize

sql_function:
  name: canonical
  description: Get canonical/official form (auto-detects type)
  args:
    - name: value
      type: VARCHAR
  returns: VARCHAR
  shape: SCALAR
  operators:
    - "CANONICAL({{ value }})"
    - "{{ value }} CANONICAL"
  cache: true
  test_cases:
    - sql: "SELECT canonical('MICROSOFT CORPORATION')"
      expect:
        type: contains
        value: "Microsoft"
      description: "Company name canonicalized"
    - sql: "SELECT canonical('NYC')"
      expect:
        type: one_of
        values: ["New York City", "New York", "NYC"]
      description: "City abbreviation expanded"

cells:
  - name: canonicalize
    model: "{{ models.standard }}"

    instructions: |
      Return the canonical/official form of this value.

      VALUE: {{ input.value }}

      Steps:
      1. Detect what type of entity this is (company, city, person name, address, phone, etc.)
      2. Return the standard/canonical form

      CITY ABBREVIATIONS (expand these):
      - "NYC" → "New York City"
      - "LA" → "Los Angeles"
      - "SF" → "San Francisco"
      - "DC" → "Washington, D.C."
      - "NOLA" → "New Orleans"
      - "CHI" → "Chicago"
      - "ATL" → "Atlanta"
      - "BOS" → "Boston"
      - "PHX" → "Phoenix"

      COMPANY NAMES:
      - "MICROSOFT CORP" → "Microsoft"
      - "INTL BUSINESS MACHINES" → "IBM"
      - "AAPL" → "Apple"
      - "GOOGL" → "Google"

      OTHER:
      - Addresses: Expand abbreviations ("123 main st" → "123 Main Street")
      - Phones: E.164 format ("(555) 123-4567" → "+15551234567")
      - Emails: Lowercase
      - Names: Title Case ("dr john smith" → "Dr. John Smith")

      Return ONLY the canonical form. No explanation, no quotes.
      If input is empty, return NULL (without quotes).

    rules:
      max_turns: 1
