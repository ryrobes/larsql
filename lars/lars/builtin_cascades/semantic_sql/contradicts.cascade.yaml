cascade_id: semantic_contradicts
internal: true
description: 'Logical contradiction check - returns TRUE if text A contradicts text
  B.

  Used for finding inconsistent reports or filtering out conflicting information.

  '
inputs_schema:
  text_a: The first text
  text_b: The second text or criterion
sql_function:
  name: semantic_contradicts
  description: Returns TRUE if text_a contradicts text_b
  args:
  - name: text_a
    type: VARCHAR
  - name: text_b
    type: VARCHAR
  returns: BOOLEAN
  shape: SCALAR
  operators:
  - '{{ text_a }} CONTRADICTS {{ text_b }}'
  cache: true
  test_cases:
  # Function syntax
  - sql: SELECT semantic_contradicts('The product is excellent', 'The product is terrible')
    expect: true
    description: "Function: Contradicting statements detected"
  - sql: SELECT semantic_contradicts('The sky is blue', 'Water is wet')
    expect: false
    description: "Function: Non-contradicting statements"
  # Infix CONTRADICTS syntax - need WITH for proper parsing
  - sql: "WITH t AS (SELECT 'We will increase prices' AS stmt) SELECT stmt FROM t WHERE stmt CONTRADICTS 'Prices will remain stable'"
    expect:
      type: contains
      value: increase prices
    description: "Infix CONTRADICTS: detects price contradiction"
  # Skip flaky test - LLM interpretation of "3pm" vs "afternoon" varies
  - sql: "WITH t AS (SELECT 'The meeting is at 3pm' AS stmt) SELECT CASE WHEN stmt CONTRADICTS 'The meeting is in the afternoon' THEN 'yes' ELSE 'no' END FROM t"
    skip: true
    expect: "no"
    description: "Infix CONTRADICTS: compatible statements (skipped - LLM varies)"
cells:
- name: check_contradiction
  model: "{{ models.standard }}"
  instructions: |
    Do these two texts logically contradict each other?

    TEXT A: {{ input.text_a }}
    TEXT B: {{ input.text_b }}

    STEP 1 - Identify subject of each statement:
    - What is Text A about?
    - What is Text B about?

    STEP 2 - Are they about the SAME subject?
    - If NO (different subjects) → Answer: false
    - If YES → Continue to Step 3

    STEP 3 - Do they make OPPOSING claims about that subject?
    - If YES → Answer: true
    - If NO → Answer: false

    CRITICAL RULE: Statements about DIFFERENT topics are NEVER contradictions.

    Examples:
    - "It's raining" vs "It's sunny" → true (same topic: weather, opposing)
    - "The car is red" vs "The car is blue" → true (same subject: car color, opposing)
    - "I like pizza" vs "Dogs are mammals" → false (DIFFERENT topics)
    - "The sky is blue" vs "Water is wet" → false (DIFFERENT topics: sky vs water)
    - "Sales are up" vs "Profits are down" → false (related but not opposing - both can be true)

    Think through steps 1-3, then respond with ONLY the word "true" or "false".
    
    CRITICAL: Your final response must be EXACTLY one word: true or false
    Do NOT wrap in JSON. Do NOT add explanation after. Just: true or false
  rules:
    max_turns: 1
  output_schema:
    type: boolean
