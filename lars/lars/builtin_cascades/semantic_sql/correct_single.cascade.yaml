cascade_id: correct_single
internal: true
description: 'Correct factual or logical errors using contextual information.

  More intelligent than FIX - uses real-world knowledge.

  '
inputs_schema:
  value: The value to correct
  context: Context to use for correction
sql_function:
  name: correct
  description: Correct factual errors using context
  args:
  - name: value
    type: VARCHAR
  - name: context
    type: VARCHAR
    description: 'Context for correction: related fields, constraints, hints'
  returns: VARCHAR
  shape: SCALAR
  operators:
  - CORRECT({{ value }}, '{{ context }}')
  - '{{ value }} CORRECTED BY ''{{ context }}'''
  cache: true
  test_cases:
  - sql: SELECT correct('02101', 'city is San Francisco')
    expect:
      type: regex
      pattern: 9[4-5]\d{3}
    description: Zip corrected for city
cells:
- name: contextual_correct
  model: "{{ models.standard }}"
  instructions: |
    Correct this value using the provided context.

    VALUE: {{ input.value }}
    CONTEXT: {{ input.context }}

    Examples:
    - "San Franciso" + "state is CA" → San Francisco
    - "02101" + "city is San Francisco" → 94102
    - "02101" + "city is Los Angeles" → 90001
    - "Gogle" + "domain is google.com" → Google
    - "2024-02-30" + "must be valid date" → 2024-02-29

    KEY GEOGRAPHIC EXAMPLES:
    - Boston zip codes start with 02 (02101, 02102, etc.)
    - San Francisco zip codes start with 94 (94102, 94103, etc.)
    - Los Angeles zip codes start with 90 (90001, 90002, etc.)
    - New York zip codes start with 10 (10001, 10002, etc.)

    So: "02101" (Boston zip) + "city is San Francisco" → correct to a SF zip like "94102"

    Rules:
    - If context clearly indicates the value is wrong, provide the corrected value
    - If ambiguous, return the original value
    - Preserve formatting style where possible

    CRITICAL: Return ONLY the corrected value itself.
    NO explanation. NO reasoning. NO sentences.
    Just the value: 94102
  rules:
    max_turns: 1
