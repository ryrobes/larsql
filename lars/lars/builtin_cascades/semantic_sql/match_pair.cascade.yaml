cascade_id: semantic_match_pair
internal: true
description: 'Pairwise semantic relationship check for fuzzy JOINs and deduplication.

  Returns TRUE if the two values satisfy the relationship.

  '
inputs_schema:
  left: First value
  right: Second value
  relationship: 'Relationship to check (default: same entity)'
sql_function:
  name: semantic_match_pair
  description: Checks whether two values match under a relationship
  args:
  - name: left
    type: VARCHAR
  - name: right
    type: VARCHAR
  - name: relationship
    type: VARCHAR
    default: same entity
  returns: BOOLEAN
  shape: SCALAR
  cache: false
  test_cases:
  - sql: SELECT semantic_match_pair('John Smith', 'J. Smith')
    expect: true
    description: Name variations match
cells:
- name: evaluate_pair
  model: "{{ models.standard }}"
  takes:
    factor: 3
    evaluator_instructions: |
      Pick the response that correctly determines whether the two values refer to the same entity.
      Consider: name abbreviations (J. = John), nicknames, typos, formatting differences.
      "John Smith" and "J. Smith" are the SAME person - J. is a common abbreviation for John.
  instructions: |
    Do these two values refer to the {{ input.relationship | default("same entity") }}?

    Value 1: {{ input.left }}
    Value 2: {{ input.right }}

    Think step by step:
    1. What type of values are these? (names, companies, addresses, etc.)
    2. Could one be an abbreviation, nickname, or variant of the other?
    3. For names: "J. Smith" is a common abbreviation for "John Smith" (J. = John)
    4. Are there any typos or formatting differences that don't change identity?

    After reasoning, respond with ONLY "true" or "false".
  rules:
    max_turns: 1
  output_schema:
    type: boolean
