cascade_id: pipeline_render_canvas
internal: true
pure: true  # Output depends ONLY on inputs - enables cascade-level caching that skips launch entirely
description: |
  PIPELINE cascade for composing multiple visualization panels into a canvas layout.

  Uses pure Python - no LLM calls.

  Supports two layout modes:

  GRID Layout (cell-based positioning):
      SELECT * FROM CANVAS(
        PANEL('Team', 1, 1, employees),
        PANEL('Metrics', 2, 1, metrics)
      ) WITH GRID(2, 1)

  FLOATING Layout (pixel-based positioning):
      SELECT * FROM CANVAS(
        PANEL('Chart', 50, 50, chart_data, width := 400, height := 300),
        PANEL('Info', 500, 50, info_data, width := 200, height := 150)
      ) WITH FLOATING(800, 600)

  The CANVAS rewriter transforms these to:
      SELECT * FROM _canvas_panels THEN RENDER_CANVAS('grid', cols, rows)
      SELECT * FROM _canvas_panels THEN RENDER_CANVAS('floating', width, height)

inputs_schema:
  layout_type: "Layout type: 'grid' or 'floating'"
  dim1: "Grid columns (GRID) or canvas width (FLOATING)"
  dim2: "Grid rows (GRID) or canvas height (FLOATING)"
  _table: "Query results as JSON records"
  _table_columns: "List of column names"

sql_function:
  name: RENDER_CANVAS
  description: Compose multiple panels into a canvas layout for visualization
  args:
    - name: layout_type
      type: VARCHAR
      optional: true
      default: "'grid'"
    - name: dim1
      type: INTEGER
      optional: true
      default: 2
    - name: dim2
      type: INTEGER
      optional: true
      default: 2
    - name: _table
      type: TABLE
  returns: TABLE
  shape: PIPELINE
  operators:
    - 'THEN RENDER_CANVAS'
    - "THEN RENDER_CANVAS('{{ layout_type }}')"
    - "THEN RENDER_CANVAS('{{ layout_type }}', {{ dim1 }})"
    - "THEN RENDER_CANVAS('{{ layout_type }}', {{ dim1 }}, {{ dim2 }})"
  cache: true

cells:
  - name: render
    deterministic: true
    tool: python:lars.pipeline_tools.render_canvas
    inputs:
      _table: "{{ input._table }}"
      layout_type: "{{ input.layout_type | default('grid') }}"
      dim1: "{{ input.dim1 | default(2) }}"
      dim2: "{{ input.dim2 | default(2) }}"
      _table_columns: "{{ input._table_columns }}"
