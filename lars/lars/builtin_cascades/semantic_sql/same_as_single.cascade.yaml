# SAME_AS - Semantic entity equality for fuzzy joins
# The holy grail of ETL - joining tables without exact matches
#
# SQL Usage:
#   SELECT * FROM customers c, vendors v
#   WHERE c.company SAME_AS v.vendor_name
#
#   SELECT * FROM table_a a
#   JOIN table_b b ON a.name SAME_AS b.client_name
#
#   -- With entity type hint:
#   WHERE c.company SAME_AS v.vendor AS 'company'
#
# Examples:
#   "IBM" SAME_AS "International Business Machines" → true
#   "John Smith" SAME_AS "J. Smith" → true (with 'name' type)
#   "123 Main St" SAME_AS "123 Main Street, Apt 1" → true (with 'address' type)

cascade_id: same_as_single
internal: true

description: |
  Semantic entity equality check for fuzzy joins. Determines if two values
  refer to the same real-world entity despite different representations.

inputs_schema:
  left: First value
  right: Second value
  entity_type: Optional entity type hint (company, person, address, product)

sql_function:
  name: same_as
  description: Check if two values refer to the same entity (for fuzzy joins)
  args:
    - name: left
      type: VARCHAR
    - name: right
      type: VARCHAR
    - name: entity_type
      type: VARCHAR
      optional: true
      default: "auto"
      description: "Entity type: company, person, address, product, or auto"
  returns: BOOLEAN
  shape: SCALAR
  test_cases:
    - sql: "SELECT same_as('IBM', 'International Business Machines')"
      expect: true
      description: "Company aliases match"
    - sql: "SELECT same_as('Toyota', 'Honda')"
      expect: false
      description: "Different car companies don't match"
    - sql: "SELECT same_as('John Smith', 'J. Smith', 'person')"
      expect: true
      description: "Name variations match with type hint"
  operators:
    - "{{ left }} SAME_AS {{ right }}"
    - "{{ left }} SAME_AS {{ right }} AS '{{ entity_type }}'"
    - "SAME_AS({{ left }}, {{ right }})"
    - "SAME_AS({{ left }}, {{ right }}, '{{ entity_type }}')"
    - "{{ left }} SAME_ENTITY {{ right }}"
  cache: false  # Temporarily disabled for testing

cells:
  - name: check_equality
    model: "{{ models.standard }}"

    instructions: |
      Do these two values refer to the SAME real-world entity?

      VALUE 1: {{ input.left }}
      VALUE 2: {{ input.right }}
      {% if input.entity_type and input.entity_type != 'auto' %}
      ENTITY TYPE: {{ input.entity_type }}
      {% endif %}

      SAME ENTITY means: Different names/representations for THE EXACT SAME thing.

      ✓ TRUE (same entity, different names):
      - "IBM" = "International Business Machines" (same company)
      - "Apple Inc" = "Apple Corporation" (same company)
      - "Coca-Cola" = "Coke" (same company/product)
      - "John Smith" = "Smith, John" (same person)
      - "J. Smith" = "John Smith" (likely same person)
      - "Bob" = "Robert" (same person, nickname)
      - "123 Main St" = "123 Main Street" (same address)

      ✗ FALSE (different entities):
      - "Toyota" ≠ "Honda" (DIFFERENT car companies!)
      - "Ford" ≠ "GM" (DIFFERENT car companies!)
      - "Apple" ≠ "Microsoft" (DIFFERENT tech companies!)
      - "IBM" ≠ "Apple" (DIFFERENT companies!)
      - "John Smith" ≠ "Jane Smith" (DIFFERENT people!)
      - "123 Main St" ≠ "124 Main St" (DIFFERENT addresses!)
      - "iPhone 15" ≠ "iPhone 15 Pro" (DIFFERENT products!)

      CRITICAL: Being in the same INDUSTRY does not make them the same entity!
      Toyota and Honda are both car companies, but they are DIFFERENT companies.

      Think: Are these two names for THE EXACT SAME entity, or two different entities?

      Return ONLY "true" or "false".

    rules:
      max_turns: 1

    output_schema:
      type: boolean
