[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larsql"
version = "2.4.0"
description = "LARS: Declarative agent framework with first class SQL integration"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ryan Robitaille", email = "ryan.robitaille@gmail.com"}]
license = {text = "OSASSY"}
keywords = ["agents", "llm", "workflows", "declarative", "sql", "semantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ========================================================================
    # HIGH RISK - Tight version constraints (breaking changes common)
    # These libs change frequently or break in minor versions
    # ========================================================================
    "litellm>=1.80,<1.90",           # Rapid development, weekly releases with breaking changes
    "duckdb>=1.4,<1.5",              # Known for breaking changes in minor versions
    "pydantic>=2.10,<3.0",           # v2 is stable, v3 will be breaking rewrite
    

    # ========================================================================
    # MEDIUM RISK - Major version constraints (stable within major version)
    # Allow minor/patch updates, block major version bumps
    # ========================================================================
    "pandas>=2.0,<3.0",              # Stable 2.x series
    "pyarrow>=14.0,<24.0",           # Compatibility with pandas 2.x and downstream libs
    "flask>=3.0,<4.0",               # Current stable major version
    "flask-cors>=6.0,<7.0",          # Follows flask versioning
    "altair>=5.0,<6.0",              # Compatible with downstream tools (streamlit requires <6)
    "plotly>=5.0,<7.0",              # Stable visualization library
    "sqlglot>=28.0,<29.0",           # Required for compatible Rust tokenizer (fixes EXPLAIN cache detection)
    "clickhouse-driver>=0.2,<0.3",   # ClickHouse client library
    "clickhouse-connect>=0.7,<0.8",  # Alternative ClickHouse client
    "jinja2>=3.0,<4.0",              # Template engine
    #"chdb>=2.0,<3.0",               # ClickHouse embedded
    #"chdb",                          # ClickHouse embedded
    # chromadb removed - using native DuckDB VSS for vector search

    # ========================================================================
    # LOW RISK - Minimum version only (very stable APIs)
    # These rarely introduce breaking changes
    # ========================================================================
    "requests>=2.31",                # Extremely stable HTTP library
    "python-dotenv>=1.0",            # Simple, stable env loader
    "rich>=13.0",                    # Terminal formatting
    "InquirerPy>=0.3.4",             # Interactive prompts for TUI wizards
    "textual>=3.0",                  # TUI framework (Looking Glass foundation)
    "pyfiglet>=1.0",                 # ASCII art text for TUI headers
    "prompt-toolkit>=3.0",           # Advanced text input/editing for TUI
    "psutil>=6.0",                   # System monitoring for TUI panels
    "numpy>=1.24",                   # Array ops for color extraction/effects
    "climage>=0.2",                  # ANSI image rendering for TUI backgrounds
    "colorthief>=0.2",               # Extract dominant colors from images
    "pillow>=10.0",                  # Image processing
    "jsonschema>=4.0",               # JSON validation
    "watchdog>=4.0",                 # File system monitoring
    "readchar>=4.0",                 # Keyboard input
    "pypdf>=4.0",                    # PDF parsing
    "openpyxl>=3.1",                 # Excel file support
    "ruamel.yaml>=0.18",             # YAML parsing
    "miniaudio>=1.59",               # Audio library
    "kaleido>=0.2",                  # Static image export
    "vl-convert-python>=1.0",        # Vega-Lite conversion
    "gunicorn[gevent]>=23.0",        # WSGI server
    "psycopg[binary]>=3.1",          # PostgreSQL client (PGwire for Studio multi-worker)
    "authlib>=1.3,<2.0",             # JWT and OAuth2 authentication
    "passlib[argon2]>=1.7",          # Password hashing with Argon2
    "nest_asyncio",
]

[project.urls]
Homepage = "https://github.com/ryrobes/larsql"
Repository = "https://github.com/ryrobes/larsql"
Documentation = "https://larsql.com/"

[tool.hatch.build.targets.wheel]
packages = ["lars"]

[tool.hatch.build.targets.sdist]
include = [
    "lars/**/*",
]

[project.optional-dependencies]
# Extra dependencies for specific features (with version constraints)
browser = [
    # Pure Python browser automation (replaces Node.js rabbitize)
    "playwright>=1.40,<2.0",         # Browser automation
    "fastapi>=0.100,<1.0",           # Web framework for browser service
    "uvicorn[standard]>=0.23,<1.0",  # ASGI server
    "httpx>=0.25,<1.0",              # HTTP client for tools
    # Note: numpy is already a transitive dependency
    # Note: pillow is already in main dependencies
    # After install, run: playwright install chromium
]
docker = [
    "docker>=7.0,<8.0",              # For linux_shell and run_code tools
]
local-models = [
    "transformers>=4.45,<5.0",       # HuggingFace transformers
    "torch>=2.0,<3.0",               # PyTorch for local models
    "accelerate>=0.20,<1.0",         # HuggingFace acceleration
    "huggingface-hub>=0.34,<1.0",    # transformers 4.x requires <1.0
]
enterprise = [
    # Enterprise database connectors (pure Python, no system drivers needed)
    "oracledb>=2.0,<3.0",            # Oracle (thin mode = pure Python)
    "pymssql>=2.2,<3.0",             # Microsoft SQL Server
    "ibm-db>=3.2,<4.0",              # IBM DB2
    "hdbcli>=2.0,<3.0",              # SAP HANA
]
all = [
    "docker>=7.0,<8.0",
    "transformers>=4.45,<5.0",
    "torch>=2.0,<3.0",
    "accelerate>=0.20,<1.0",
    "huggingface-hub>=0.34,<1.0",
    "playwright>=1.40,<2.0",
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "httpx>=0.25,<1.0",
    "oracledb>=2.0,<3.0",
    "pymssql>=2.2,<3.0",
    "ibm-db>=3.2,<4.0",
]

[project.scripts]
lars = "lars.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
]
markers = [
    "requires_llm: marks tests that require LLM API access (OpenRouter)",
    "requires_clickhouse: marks tests that require ClickHouse database",
    "integration: marks integration tests that need external services",
]
# Default: run all tests except those requiring external services
# Use -m "not integration" to skip integration tests
# Use -m "" to run all tests
